<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/eventos.js" defer></script>
</head>
<body>
    <div class="contenedor">


        <div class="carta">
            Cara A
        </div>

  
        <div id="cont_padre">
            <div class="tarjeta">
                <img src="img/foto1f.jpg" alt="Cámara vieja">
                <h3>Cámara Vieja</h3>
                <p>Una Cámara de fotos antigua.</p>
                <button id="btn_abrir">Abrir</button>
            </div>
            <dialog id="modal_tarjeta" class="capa_modal">
                <h2>Más Información</h2>
                <p>Este es el texto Oculto que aparece</p>
                <p><strong>Marca:</strong>AmtiguaCam</p>
                <p><strong>Año:</strong>1970</p>
                <button id="btn_cerrar">Cerrar</button>
            </dialog>
        </div>

     
        <div id="tarjeta" class="producto">
            <h3>Licuadora Oster</h3>
            <p>Precio: 60$</p>
            <button id="btnOferta">Aplicar Oferta</button>
        </div>

    </div>
</body>
</html>
